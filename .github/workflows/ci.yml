name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check deployment files
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run local checks
        run: bash scripts/check.sh

      - name: Validate the Nginx server block
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo cp deploy/nginx/sites-available/myhomepage.conf /etc/nginx/sites-available/myhomepage.conf
          sudo ln -sf /etc/nginx/sites-available/myhomepage.conf /etc/nginx/sites-enabled/myhomepage.conf
          sudo nginx -t
