# Main Nginx configuration
#
# This file is optional on Debian/Ubuntu: the stock /etc/nginx/nginx.conf already
# includes /etc/nginx/sites-enabled/*. Install this file only if you want the
# tuned defaults below (gzip, logging format, server_tokens).

user www-data;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_comp_level  5;
    gzip_types       text/plain text/css text/javascript application/javascript
                     application/json application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
