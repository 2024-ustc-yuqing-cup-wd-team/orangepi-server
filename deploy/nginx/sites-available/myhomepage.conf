# MyHomePage — static site at /, optional API at /api/
#
# Install:
#   sudo cp deploy/nginx/sites-available/myhomepage.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/myhomepage.conf /etc/nginx/sites-enabled/myhomepage.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The site files are deployed by deploy/scripts/deploy-site.sh into
# /var/www/myhomepage. If you change the path, update `root` below.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/myhomepage;
    index index.html;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static site. The $uri.html fallback lets /bookmarks resolve to
    # bookmarks.html without exposing the extension.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets for a week. Everything is versioned by content in the
    # repository, so a long TTL is safe for this LAN deployment.
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
    }

    # Optional Express API (server/). Remove this block if you only host the
    # static site.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
